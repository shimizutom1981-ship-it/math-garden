function makeStarterQuestion(i){
 const step=adaptiveState().prepStep,math=i<JP_START;
 const shuffled=STARTER_PICTURES.slice().sort(()=>Math.random()-.5);
 if(math){
  const max=[3,5,5][step],n=rand(1,max),symbol=shuffled[0];

function makeQuestion(i){

 let text=course===0?'えに あう ことばは？':course===1?'□に はいる もじは？':course===2?prompt+' を カタカナで かくと？':course===3?'「'+prompt+'」の はんたいは？':course===4?'「'+prompt+'」は なんと よむ？':course===5?'□に はいる ことばは？':prompt;

const KEY='kazunoniwa-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||data.version!==1||!Array.isArray(data.profiles)||!data.profiles.length)data={version:1,current:0,sound:true,profiles:[{name:'こども 1',stats:{},flowers:0},{name:'こども 2',stats:{},flowers:0}]};if(!data.profiles[data.current])data.current=0;let session=null,q=null,view='home';const app=document.querySelector('#app');const person=()=>data.profiles[data.current];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{document.querySelector('#storageWarning').textContent='きろくを保存できません。ブラウザの保存設定を確認してください。'}}function japaneseNumber(value){

 .replace(/[＝=]/g,' は ').replace(/[？?]/g,'？');
}
function speak(t){if(data.sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(speechText(t));let voices=speechSynthesis.getVoices();let voice=voices.find(v=>/^ja(?:[-_]|$)/i.test(v.lang)&&v.localService)||voices.find(v=>/^ja(?:[-_]|$)/i.test(v.lang));if(voice)u.voice=voice;u.lang='ja-JP';u.rate=.8;speechSynthesis.speak(u)}}function stats(i){return person().stats[i]||{ok:0,total:0,streak:0,mastered:false}}function recommended(){return adaptiveState().level}function refresh(){document.querySelector('#profile').innerHTML=data.profiles.map((p,i)=>`<option value="${i}" ${i===data.current?'selected':''}>${esc(p.name)}</option>`).join('');document.querySelector('#sound').textContent=data.sound?'🔊 おと ON':'🔇 おと OFF'}function home(){view='home';session=null;refresh();let rec=recommended();app.innerHTML=`<nav class="subject-tabs" aria-label="きょうか"><button class="${subject==='math'?'primary':'sub'}" aria-pressed="${subject==='math'}" onclick="setSubject('math')">🔢 さんすう</button><button class="${subject==='jp'?'primary':'sub'}" aria-pressed="${subject==='jp'}" onclick="setSubject('jp')">📖 こくご</button></nav><section class="hero"><div><div class="eyebrow">5さいから · がくねんのない ${subject==='math'?'さんすう':'こくご'}</div><h1>「できた！」の めを、<br>そだてよう。</h1><p>${subject==='math'?'かぞえて、さわって、みつけよう。':'よんで、えらんで、ことばを ふやそう。'}<br>きょうは 5もん。じぶんの ペースで。</p><button class="primary" onclick="start(${rec},true)">つづきから はじめる　→</button><p class="muted">きょうの じぶんに ぴったりの 5もん　•　🌸 ${person().flowers}この おはな</p></div><div class="garden" aria-hidden="true"><div class="sun"></div><div class="bubble">きょうも、ひとつ できた！</div><div class="plant">🌷🌱</div></div></section><div class="sectiontitle"><h2>すきな ところから</h2><span class="muted">もどっても、さきへ すすんでも OK</span></div><div class="cards">${TOPICS.map((t,i)=>{if(subject==='math'?i>=JP_START:i<JP_START)return '';let s=stats(i);return `<button class="card ${i===rec?'recommended':''}" onclick="start(${i},false)"><span class="icon">${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small><div class="progress"><span style="width:${s.mastered?100:Math.min(100,s.streak/4*100)}%"></span></div><span class="tag">${s.mastered?'✓ できた！ もういちども OK':i===rec?'おすすめの いっぽ':'じゆうに チャレンジ'}</span></button>`}).join('')}</div>`}
function makeMathQuestion(i){let [,, ,type,max]=TOPICS[i],a,b,answer,text,hint,objects=0,choices;if(type==='count'){a=rand(i===1?6:1,max);answer=a;text='いくつ あるかな？';hint='ひとつずつ さわって、かぞえてみよう。';objects=a}else if(type==='compare'){a=rand(1,9);b=rand(a+1,10);answer=b;text=`${a} と ${b}\nおおきい かずは どっち？`;choices=[a,b].sort(()=>Math.random()-.5);hint=`${a}この あとにも かぞえられる ${b}この ほうが おおいよ。`}else if(type==='add'||type==='mixed'&&Math.random()<.5){a=rand(1,max-1);b=rand(1,max-a);answer=a+b;text=`${a} ＋ ${b} ＝ ？`;hint=`${a}から、あと ${b}こ かぞえよう。`;if(max<=10)objects=a+b}else if(type==='sub'||type==='mixed'){a=rand(2,max);b=rand(1,a);answer=a-b;text=`${a} − ${b} ＝ ？`;hint=`${a}こから ${b}こ とると、${answer}こ のこるよ。`;if(max<=10)objects=a}else if(type==='mul'){a=rand(2,9);b=rand(1,9);answer=a*b;text=`${a} × ${b} ＝ ？`;hint=`${a}こずつの まとまりが ${b}こ。${Array(b).fill(a).join(' ＋ ')} を かんがえよう。`}else if(type==='div'){b=rand(2,9);answer=rand(1,9);a=b*answer;text=`${a} ÷ ${b} ＝ ？`;hint=`${a}こを ${b}にんで おなじ かずずつ わけるよ。${b} × □ ＝ ${a} の □を さがそう。`}else{b=rand(2,6);a=rand(1,b-1);answer=`${a}/${b}`;text=`${b}こに おなじ おおきさで わけたよ。\nいろの ついた ぶぶんは？`;hint=`したの すうじは ぜんぶの ${b}こ。うえの すうじは いろの ついた ${a}こ。`;choices=[answer,`${b}/${a}`,`${a+1}/${b}`,`${a}/${b+1}`]}
if(!choices){let set=new Set([answer]);while(set.size<4)set.add(Math.max(0,answer+rand(-Math.max(3,Math.ceil(answer/3)),Math.max(3,Math.ceil(answer/3)))));choices=[...set]}choices=choices.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);return {i,type,a,b,answer,text,hint,objects,choices}}
function start(i,auto){subject=i<JP_START?'math':'jp';session={i,auto,adjusted:false,seen:{},n:0,correct:0,help:false,wrong:false,done:false,misses:0};view='quiz';nextQuestion()}function nextQuestion(){if(session.n>=5){finish();return}session.help=false;session.wrong=false;session.done=false;q=makeQuestion(session.auto&&session.n>=adaptiveState().newCount?Math.max(subjectRange()[0],session.i-1):session.i);app.innerHTML=`<section class="quiz"><div class="quiztop"><button class="sub" onclick="home()">⌂ にわへ</button><span>${session.auto?(subject==='math'?'🔢 さんすうの みち':'📖 ことばの もり'):TOPICS[session.i][0]+' '+TOPICS[session.i][1]}</span><div class="dots" aria-label="5問中${session.n+1}問目">${Array.from({length:5},(_,i)=>`<span class="dot ${i<=session.n?'on':''}"></span>`).join('')}</div></div><div class="board"><div class="eyebrow">${session.n+1} / 5　•　ゆっくりで だいじょうぶ</div><h1 class="question">${esc(q.text)}</h1>${q.visual?`<div class="word-visual ${q.course===0?'picture':''}">${esc(q.visual)}</div>`:''}<button class="sub" onclick="speakQuestion()">🔊 きく</button>${q.objects?`<div class="objects">${Array.from({length:q.objects},(_,i)=>`<button class="object" aria-label="${i+1}こめ" onclick="this.classList.toggle('counted');speak('${i+1}')">${q.symbol||(q.type==='sub'&&i>=q.answer?'🍃':'🍎')}</button>`).join('')}</div>`:''}${q.type==='fraction'?`<div style="display:flex;height:70px;max-width:420px;margin:24px auto;border:2px solid #497554;border-radius:12px;overflow:hidden">${Array.from({length:q.b},(_,i)=>`<div style="flex:1;background:${i<q.a?'#eab95f':'#fff'};border-right:1px solid #497554"></div>`).join('')}</div>`:''}<div class="choices">${q.choices.map((x,i)=>`<button class="choice ${q.type==='jp'?'jp-choice':''}" onclick="answer(${i},this)">${x}</button>`).join('')}</div><div class="feedback" role="status" id="feedback">${q.objects?'えを さわると、しるしが つくよ。':''}</div><div id="hint" class="hint hidden"></div><div class="actions"><button id="hintButton" class="sub" onclick="showHint()">💡 ヒント</button><button id="next" class="primary hidden" onclick="advance()">つぎへ →</button></div></div></section>`;speakQuestion()}
function speakQuestion(){speak(q.type==='jp'&&q.course===4?'この かんじは、なんと よむ？':q.text)}
function showHint(){session.help=true;let h=document.querySelector('#hint');h.classList.remove('hidden');h.textContent=q.hint;speak(q.hint)}function answer(idx,el){if(session.done)return;let value=q.choices[idx];if(value!==q.answer){session.wrong=true;el.disabled=true;document.querySelector('#feedback').textContent='おしい！ ヒントを みて、もういちど。';speak('おしい。もういちど やってみよう');showHint();return}session.done=true;let clean=!session.wrong&&!session.help;let s=stats(q.i);s.total++;if(clean){s.ok++;s.streak++;session.correct++;if(s.streak>=4)s.mastered=true}else{s.streak=0;session.misses++}s.recent=[...(Array.isArray(s.recent)?s.recent:[]),clean?1:0].slice(-8);person().stats[q.i]=s;save();el.classList.add('correct');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.querySelector('#feedback').textContent=clean?'✨ せいかい！ よく できたね。':'🌱 できたね！ ひとつ まなんだよ。';document.querySelector('#hintButton').disabled=true;document.querySelector('#next').classList.remove('hidden');speak('せいかい。よくできたね')}
function adaptiveState(){let p=person();if(!p.adaptive||typeof p.adaptive!=='object')p.adaptive={};let [lo,hi]=subjectRange();let a=p.adaptive[subject];if(!a||!Number.isInteger(a.level)||a.level<lo||a.level>=hi){let level=lo;while(level<hi-1&&stats(level).mastered)level++;a=p.adaptive[subject]={level,cooldown:0}}if(a.easyVersion!==1&&(p.name.includes('芽依')||data.current===1)){a.level=lo;a.newCount=5;a.strongSets=0;a.prepStep=0;a.prepWins=0;a.easyVersion=1}if(!Number.isInteger(a.cooldown)||a.cooldown<0)a.cooldown=0;if(a.paceVersion!==2){a.newCount=a.intro?1:5;a.strongSets=0;a.paceVersion=2}if(!Number.isInteger(a.newCount)||a.newCount<1||a.newCount>5)a.newCount=5;return a}
function advance(){
 if(!session.done)return;
 session.n++;
 if(session.auto){
  const a=adaptiveState(),[lo,hi]=subjectRange();
  if(a.prepStep<3){if(session.n>=5){a.prepWins=session.correct>=4?(a.prepWins||0)+1:0;if(a.prepWins>=3){a.prepStep++;a.prepWins=0;a.strongSets=0}if(session.misses>=2&&a.prepStep>0){a.prepStep--;a.prepWins=0}}save();nextQuestion();return}
  if(!Number.isInteger(a.strongSets))a.strongSets=0;
  if(!session.adjusted&&session.misses>=2&&session.i>lo){
   session.i--;a.level=session.i;a.strongSets=0;a.newCount=5;a.intro=false;session.adjusted=true;
  }
  if(session.n>=5){
   if(session.adjusted||session.correct<4)a.strongSets=0;
   else if(a.newCount<5){
    a.strongSets++;
    if(a.strongSets>=2){a.newCount++;a.strongSets=0}
   }else{
    // A full level needs five confident sets (at least 25 answers).
    a.strongSets++;
    if(a.strongSets>=5&&a.level<hi-1){
     a.level++;a.newCount=1;a.intro=true;a.strongSets=0;
    }
   }
  }
  save();
 }
 nextQuestion();
}
function finish(){person().flowers++;save();view='result';app.innerHTML=`<section class="panel center"><div class="eyebrow">きょうの 5もん、おつかれさま</div><div class="big">🌷</div><h1>おはなが ひとつ<br>さきました！</h1><p>さいごまで かんがえられたね。<br>ヒントで わかったことも、たいせつな いっぽ。</p><div class="actions"><button class="primary" onclick="home()">にわに もどる →</button><button class="sub" onclick="start(recommended(),true)">もう 5もん やる</button></div></section>`;speak('おはなが ひとつ さきました。よく がんばったね')}
function parents(){view='parent';session=null;app.innerHTML=`<section class="panel"><button class="sub" onclick="home()">← にわへ</button><h1 style="font-size:30px">おうちの方へ</h1><p>学年や速さで比べず、理解できたところから。すべてのコースを自由に選べます。</p><label>表示する名前 <input id="name" maxlength="20" value="${esc(person().name)}"></label><button class="sub" onclick="rename()">名前を保存</button><h2>学習のきろく</h2><p class="muted">おはな ${person().flowers}こ ／ 5問を終えると1つ増えます。</p>${TOPICS.map((t,i)=>{let s=stats(i);return `<div class="row"><span>${t[0]} ${t[1]}</span><span class="muted">${s.ok} / ${s.total}問 自力正解 ${s.mastered?'・達成':''}</span></div>`}).join('')}<h2>出題のしくみ</h2><p>「きょうのステージ」と「つづきから」は、子どもごと・教科ごとの出題位置を保存して自動調整します。同じ範囲の直近の取り組みで自力正解が4問以上かつ最後の2問が自力正解なら次へ、ヒント・再回答が3問以上かつ最後の2問でも支援が必要なら1つ前の範囲へ調整します。1セットでの変更は最大1回、変更後は5問分を待って再判定します。1問の誤答や速さだけでは変更せず、変更の通知や降級表示は出しません。自由に選んだコースは選択範囲を維持します。「できた」は過去の達成記録であり現在の出題位置とは別です。国語は8コース・64問から出題し、同じコースの5問セットでは問題が重複しません。算数と国語の達成状況は別々に記録します。読み上げや絵も使えるため、学力・読字力の正式な判定ではありません。</p><p>読み上げは端末の日本語音声を使います。音が出ない場合はAndroidの音声・音量設定を確認してください。</p><h2>きろくの保存</h2><p>この端末・このブラウザだけに自動保存します。別端末への同期はありません。ブラウザのデータ削除で消えるため、ときどきバックアップしてください。</p><div class="actions"><button class="sub" onclick="backup()">きろくを書き出す</button><label><input type="file" id="restore" accept="application/json" style="max-width:250px" aria-label="きろくを読み込む"></label></div><p id="importStatus" role="status"></p><p class="muted">AndroidではBraveやChromeで開き、メニューからホーム画面に追加すると便利です。インターネット接続が必要です。</p></section>`;document.querySelector('#restore').onchange=restore}
function rename(){let n=document.querySelector('#name').value.trim();if(n){person().name=n;save();refresh();parents()}}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kazunoniwa-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(e){let status=document.querySelector('#importStatus');try{let file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error();let d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.profiles)||d.profiles.length<1||d.profiles.length>10)throw Error();for(let p of d.profiles){if(typeof p.name!=='string'||p.name.length>20||!Number.isInteger(p.flowers)||p.flowers<0||!p.stats||typeof p.stats!=='object')throw Error();for(let [k,s] of Object.entries(p.stats)){if(!/^\d+$/.test(k)||+k>=TOPICS.length||!s||!['ok','total','streak'].every(x=>Number.isInteger(s[x])&&s[x]>=0)||s.ok>s.total||typeof s.mastered!=='boolean')throw Error()}}if(!confirm('現在のきろくを、このバックアップのきろくで置き換えますか？'))return;d.current=0;d.sound=!!d.sound;data=d;save();refresh();parents();document.querySelector('#importStatus').textContent='きろくを読み込みました。'}catch{status.textContent='読み込めませんでした。かずのにわのバックアップを選んでください。'}}
document.querySelector('#profile').onchange=e=>{data.current=Number(e.target.value);save();home()};document.querySelector('#sound').onclick=()=>{data.sound=!data.sound;save();refresh();if(!data.sound&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('おとを つけました')};document.querySelector('#parent').onclick=parents;home();
</script><script src="./game.js?v=3"></script></html>
