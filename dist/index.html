<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#235b47"><title>かずのにわ</title><style>
:root{--ink:#234638;--green:#24664d;--paper:#faf8f1;--muted:#6c7b6c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,'Noto Sans JP',sans-serif}button,select,input{font:inherit}button{cursor:pointer;touch-action:manipulation;border:0;min-height:52px;border-radius:16px;padding:12px 22px;background:#fff;color:var(--ink);font-weight:700}button:hover{filter:brightness(.96)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #d59235;outline-offset:4px}button:disabled{opacity:.55;cursor:default}.primary{background:var(--green);color:white;box-shadow:0 5px 0 #194c38}.sub{background:#e9eddf}.wrap{max-width:1140px;margin:auto;padding:24px 32px}header{display:flex;align-items:center;gap:14px;justify-content:space-between;border-bottom:1px solid #dde1d4;padding-bottom:22px}.brand{font-size:24px;font-weight:900;letter-spacing:.08em}.brand small{display:block;font-size:10px;letter-spacing:.24em;color:var(--muted);margin:4px 0 0 36px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,input{min-height:50px;border:1px solid #d9dece;border-radius:14px;padding:10px;background:white;color:var(--ink)}.eyebrow{font-size:12px;letter-spacing:.17em;font-weight:800;color:var(--muted)}h1{font-size:clamp(30px,4vw,48px);line-height:1.45;margin:15px 0}p{line-height:1.8}.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:35px;align-items:center;padding:38px 0 30px}.hero p{color:var(--muted)}.garden{position:relative;background:#e9eddb;border-radius:100px 100px 30px 30px;min-height:250px;display:grid;place-items:center;overflow:hidden}.garden:after{content:'';position:absolute;bottom:-45px;width:120%;height:130px;border-radius:50%;background:#c8d7ac}.plant{font-size:100px;z-index:1;transform:rotate(-8deg)}.bubble{position:absolute;top:25px;right:26px;background:#fff;padding:10px 18px;border-radius:24px;font-size:15px;transform:rotate(6deg)}.sun{position:absolute;left:28px;top:35px;border-radius:50%;width:54px;height:54px;background:#edbc57}.sectiontitle{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 16px}.sectiontitle h2{margin:0;font-size:23px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{text-align:left;padding:22px;border:1px solid #e0e4d7;background:#fffef9;border-radius:22px;display:flex;flex-direction:column;gap:10px;min-height:175px}.card .icon{font-size:28px}.card strong{font-size:19px}.card small{font-weight:400;color:var(--muted);line-height:1.6}.progress{height:6px;background:#edf0e7;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:#8ca772}.card.recommended{border:2px solid #78986a}.tag{font-size:11px;color:#60824e}footer{padding:30px 0 10px;color:var(--muted);font-size:12px}.quiz{max-width:840px;margin:28px auto}.quiztop{display:flex;align-items:center;justify-content:space-between;gap:12px}.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#dce3d2}.dot.on{background:#6f9162}.board{background:#fffef9;border:1px solid #e1e5d9;border-radius:28px;padding:30px;text-align:center;margin-top:20px;min-height:390px}.question{font-size:clamp(25px,4vw,37px);margin:20px 0;white-space:pre-line}.objects{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:20px auto;max-width:480px}.object{font-size:32px;background:#f2f4e9;padding:8px;min-width:54px;min-height:54px}.object.counted{background:#d9e9ca;transform:translateY(-3px)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;max-width:600px;margin:24px auto}.choice{font-size:28px;background:#f1f3e9;border:2px solid #dce2d1;min-height:80px}.choice.correct{background:#d8edce;border-color:#65974d}.feedback{min-height:36px;font-weight:700;line-height:1.8}.hint{background:#fff2ce;padding:16px;border-radius:16px;line-height:1.8;margin:16px 0}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}.center{text-align:center}.big{font-size:90px}.panel{max-width:800px;margin:30px auto;background:#fffef9;padding:28px;border:1px solid #e0e4d7;border-radius:25px}.row{padding:12px 0;border-bottom:1px solid #e5e8dd;display:flex;justify-content:space-between;gap:14px;align-items:center}.notice{font-size:12px;color:#99622e;line-height:1.6}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:18px}header{align-items:flex-start}.brand{font-size:20px}.tools{justify-content:flex-end}.tools button{padding:10px;font-size:13px}.hero{grid-template-columns:1fr;gap:16px;padding-top:25px}.garden{display:none}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.board{padding:20px 14px}.question{font-size:27px}.muted{font-size:12px}}@media(prefers-reduced-motion:no-preference){.card,.choice{transition:transform .15s}.card:hover,.choice:hover{transform:translateY(-3px)}}
</style><div class="wrap"><header><div class="brand">🌱 かずのにわ<small>MATH AT YOUR OWN PACE</small></div><div class="tools"><select id="profile" aria-label="つかうひと"></select><button id="sound" aria-label="読み上げ切替">🔊 おと ON</button><button id="parent">おうちの方へ</button></div></header><main id="app"></main><footer>くらべなくて、だいじょうぶ。きみのペースで、ひとつずつ。<div id="storageWarning" class="notice"></div></footer></div>
<script>
const TOPICS=[['🌱','かずを かぞえる','1〜5この かず', 'count',5],['🌷','10までの かず','6〜10こも やってみよう','count',10],['🐣','どちらが おおい？','かずを くらべよう','compare',10],['🧩','あわせて いくつ？','5までの たしざん','add',5],['🍎','のこりは いくつ？','5までの ひきざん','sub',5],['🌼','10までの たしざん','あわせて 10まで','add',10],['🍃','10までの ひきざん','へらすと いくつ？','sub',10],['🌈','20までの たしざん','10を こえる かず','add',20],['🦋','20までの ひきざん','10を またいで ひこう','sub',20],['🌳','100までの けいさん','2けたの たしざん・ひきざん','mixed',100],['🍒','かけざん','おなじ かずを あつめよう','mul',9],['🧺','わりざん','おなじ かずずつ わけよう','div',9],['🍰','ぶんすう','おなじ おおきさに わけよう','fraction',6]];
const KEY='kazunoniwa-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||data.version!==1||!Array.isArray(data.profiles)||!data.profiles.length)data={version:1,current:0,sound:true,profiles:[{name:'こども 1',stats:{},flowers:0},{name:'こども 2',stats:{},flowers:0}]};if(!data.profiles[data.current])data.current=0;let session=null,q=null,view='home';const app=document.querySelector('#app');const person=()=>data.profiles[data.current];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{document.querySelector('#storageWarning').textContent='きろくを保存できません。ブラウザの保存設定を確認してください。'}}function speak(t){if(data.sound&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.8;speechSynthesis.speak(u)}}function stats(i){return person().stats[i]||{ok:0,total:0,streak:0,mastered:false}}function recommended(){let i=TOPICS.findIndex((_,i)=>!stats(i).mastered);return i<0?TOPICS.length-1:i}function refresh(){document.querySelector('#profile').innerHTML=data.profiles.map((p,i)=>`<option value="${i}" ${i===data.current?'selected':''}>${esc(p.name)}</option>`).join('');document.querySelector('#sound').textContent=data.sound?'🔊 おと ON':'🔇 おと OFF'}function home(){view='home';session=null;refresh();let rec=recommended();app.innerHTML=`<section class="hero"><div><div class="eyebrow">5さいから · がくねんのない さんすう</div><h1>「できた！」の めを、<br>そだてよう。</h1><p>かぞえて、さわって、みつけよう。<br>きょうは 5もん。じぶんの ペースで。</p><button class="primary" onclick="start(${rec},true)">つづきから はじめる　→</button><p class="muted">おすすめ：${TOPICS[rec][1]}　•　🌸 ${person().flowers}この おはな</p></div><div class="garden" aria-hidden="true"><div class="sun"></div><div class="bubble">きょうも、ひとつ できた！</div><div class="plant">🌷🌱</div></div></section><div class="sectiontitle"><h2>すきな ところから</h2><span class="muted">もどっても、さきへ すすんでも OK</span></div><div class="cards">${TOPICS.map((t,i)=>{let s=stats(i);return `<button class="card ${i===rec?'recommended':''}" onclick="start(${i},false)"><span class="icon">${t[0]}</span><strong>${t[1]}</strong><small>${t[2]}</small><div class="progress"><span style="width:${s.mastered?100:Math.min(100,s.streak/4*100)}%"></span></div><span class="tag">${s.mastered?'✓ できた！ もういちども OK':i===rec?'おすすめの いっぽ':'じゆうに チャレンジ'}</span></button>`}).join('')}</div>`}
function makeQuestion(i){let [,, ,type,max]=TOPICS[i],a,b,answer,text,hint,objects=0,choices;if(type==='count'){a=rand(i===1?6:1,max);answer=a;text='いくつ あるかな？';hint='ひとつずつ さわって、かぞえてみよう。';objects=a}else if(type==='compare'){a=rand(1,9);b=rand(a+1,10);answer=b;text=`${a} と ${b}\nおおきい かずは どっち？`;choices=[a,b].sort(()=>Math.random()-.5);hint=`${a}この あとにも かぞえられる ${b}この ほうが おおいよ。`}else if(type==='add'||type==='mixed'&&Math.random()<.5){a=rand(1,max-1);b=rand(1,max-a);answer=a+b;text=`${a} ＋ ${b} ＝ ？`;hint=`${a}から、あと ${b}こ かぞえよう。`;if(max<=10)objects=a+b}else if(type==='sub'||type==='mixed'){a=rand(2,max);b=rand(1,a);answer=a-b;text=`${a} − ${b} ＝ ？`;hint=`${a}こから ${b}こ とると、${answer}こ のこるよ。`;if(max<=10)objects=a}else if(type==='mul'){a=rand(2,9);b=rand(1,9);answer=a*b;text=`${a} × ${b} ＝ ？`;hint=`${a}こずつの まとまりが ${b}こ。${Array(b).fill(a).join(' ＋ ')} を かんがえよう。`}else if(type==='div'){b=rand(2,9);answer=rand(1,9);a=b*answer;text=`${a} ÷ ${b} ＝ ？`;hint=`${a}こを ${b}にんで おなじ かずずつ わけるよ。${b} × □ ＝ ${a} の □を さがそう。`}else{b=rand(2,6);a=rand(1,b-1);answer=`${a}/${b}`;text=`${b}こに おなじ おおきさで わけたよ。\nいろの ついた ぶぶんは？`;hint=`したの すうじは ぜんぶの ${b}こ。うえの すうじは いろの ついた ${a}こ。`;choices=[answer,`${b}/${a}`,`${a+1}/${b}`,`${a}/${b+1}`]}
if(!choices){let set=new Set([answer]);while(set.size<4)set.add(Math.max(0,answer+rand(-Math.max(3,Math.ceil(answer/3)),Math.max(3,Math.ceil(answer/3)))));choices=[...set]}choices=choices.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(o=>o.x);return {i,type,a,b,answer,text,hint,objects,choices}}
function start(i,auto){session={i,auto,n:0,correct:0,help:false,wrong:false,done:false,misses:0};view='quiz';nextQuestion()}function nextQuestion(){if(session.n>=5){finish();return}session.help=false;session.wrong=false;session.done=false;q=makeQuestion(session.i);app.innerHTML=`<section class="quiz"><div class="quiztop"><button class="sub" onclick="home()">⌂ にわへ</button><span>${TOPICS[session.i][0]} ${TOPICS[session.i][1]}</span><div class="dots" aria-label="5問中${session.n+1}問目">${Array.from({length:5},(_,i)=>`<span class="dot ${i<=session.n?'on':''}"></span>`).join('')}</div></div><div class="board"><div class="eyebrow">${session.n+1} / 5　•　ゆっくりで だいじょうぶ</div><h1 class="question">${q.text}</h1><button class="sub" onclick="speak(q.text)">🔊 きく</button>${q.objects?`<div class="objects">${Array.from({length:q.objects},(_,i)=>`<button class="object" aria-label="${i+1}こめ" onclick="this.classList.toggle('counted');speak('${i+1}')">${q.type==='sub'&&i>=q.answer?'🍃':'🍎'}</button>`).join('')}</div>`:''}${q.type==='fraction'?`<div style="display:flex;height:70px;max-width:420px;margin:24px auto;border:2px solid #497554;border-radius:12px;overflow:hidden">${Array.from({length:q.b},(_,i)=>`<div style="flex:1;background:${i<q.a?'#eab95f':'#fff'};border-right:1px solid #497554"></div>`).join('')}</div>`:''}<div class="choices">${q.choices.map((x,i)=>`<button class="choice" onclick="answer(${i},this)">${x}</button>`).join('')}</div><div class="feedback" role="status" id="feedback">${q.objects?'えを さわると、しるしが つくよ。':''}</div><div id="hint" class="hint hidden"></div><div class="actions"><button id="hintButton" class="sub" onclick="showHint()">💡 ヒント</button><button id="next" class="primary hidden" onclick="advance()">つぎへ →</button></div></div></section>`;speak(q.text)}
function showHint(){session.help=true;let h=document.querySelector('#hint');h.classList.remove('hidden');h.textContent=q.hint;speak(q.hint)}function answer(idx,el){if(session.done)return;let value=q.choices[idx];if(value!==q.answer){session.wrong=true;el.disabled=true;document.querySelector('#feedback').textContent='おしい！ ヒントを みて、もういちど。';speak('おしい。もういちど やってみよう');showHint();return}session.done=true;let clean=!session.wrong&&!session.help;let s=stats(q.i);s.total++;if(clean){s.ok++;s.streak++;session.correct++;if(s.streak>=4)s.mastered=true}else{s.streak=0;session.misses++}person().stats[q.i]=s;save();el.classList.add('correct');document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.querySelector('#feedback').textContent=clean?'✨ せいかい！ よく できたね。':'🌱 できたね！ ひとつ まなんだよ。';document.querySelector('#hintButton').disabled=true;document.querySelector('#next').classList.remove('hidden');speak('せいかい。よくできたね')}
function advance(){if(!session.done)return;session.n++;if(session.auto&&session.misses>=2&&session.i>0){session.i--;session.misses=0}else if(session.auto&&stats(session.i).mastered&&session.i<TOPICS.length-1){session.i++;session.misses=0}nextQuestion()}function finish(){person().flowers++;save();view='result';app.innerHTML=`<section class="panel center"><div class="eyebrow">きょうの 5もん、おつかれさま</div><div class="big">🌷</div><h1>おはなが ひとつ<br>さきました！</h1><p>さいごまで かんがえられたね。<br>ひとりで できたのは ${session.correct}もん。<br>ヒントで わかったことも、たいせつな いっぽ。</p><div class="actions"><button class="primary" onclick="home()">にわに もどる →</button><button class="sub" onclick="start(recommended(),true)">もう 5もん やる</button></div></section>`;speak('おはなが ひとつ さきました。よく がんばったね')}
function parents(){view='parent';session=null;app.innerHTML=`<section class="panel"><button class="sub" onclick="home()">← にわへ</button><h1 style="font-size:30px">おうちの方へ</h1><p>学年や速さで比べず、理解できたところから。すべてのコースを自由に選べます。</p><label>表示する名前 <input id="name" maxlength="20" value="${esc(person().name)}"></label><button class="sub" onclick="rename()">名前を保存</button><h2>学習のきろく</h2><p class="muted">おはな ${person().flowers}こ ／ 5問を終えると1つ増えます。</p>${TOPICS.map((t,i)=>{let s=stats(i);return `<div class="row"><span>${t[0]} ${t[1]}</span><span class="muted">${s.ok} / ${s.total}問 自力正解 ${s.mastered?'・達成':''}</span></div>`}).join('')}<h2>出題のしくみ</h2><p>ヒントなしの初回正解が4問続くと、そのコースを「できた」にします。「つづきから」では次のコースへ進み、同じセット内でヒントや再回答が2問になると1つ前のコースへ戻ります。自由に選んだコースでは、5問とも同じ範囲を練習します。これは学力の正式な判定ではありません。</p><p>読み上げは端末の日本語音声を使います。音が出ない場合はAndroidの音声・音量設定を確認してください。</p><h2>きろくの保存</h2><p>この端末・このブラウザだけに自動保存します。別端末への同期はありません。ブラウザのデータ削除で消えるため、ときどきバックアップしてください。</p><div class="actions"><button class="sub" onclick="backup()">きろくを書き出す</button><label><input type="file" id="restore" accept="application/json" style="max-width:250px" aria-label="きろくを読み込む"></label></div><p id="importStatus" role="status"></p><p class="muted">AndroidではChromeで開き、メニューからホーム画面に追加すると便利です。インターネット接続が必要です。</p></section>`;document.querySelector('#restore').onchange=restore}
function rename(){let n=document.querySelector('#name').value.trim();if(n){person().name=n;save();refresh();parents()}}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kazunoniwa-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(e){let status=document.querySelector('#importStatus');try{let file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error();let d=JSON.parse(await file.text());if(d.version!==1||!Array.isArray(d.profiles)||d.profiles.length<1||d.profiles.length>10)throw Error();for(let p of d.profiles){if(typeof p.name!=='string'||p.name.length>20||!Number.isInteger(p.flowers)||p.flowers<0||!p.stats||typeof p.stats!=='object')throw Error();for(let [k,s] of Object.entries(p.stats)){if(!/^\d+$/.test(k)||+k>=TOPICS.length||!s||!['ok','total','streak'].every(x=>Number.isInteger(s[x])&&s[x]>=0)||s.ok>s.total||typeof s.mastered!=='boolean')throw Error()}}if(!confirm('現在のきろくを、このバックアップのきろくで置き換えますか？'))return;d.current=0;d.sound=!!d.sound;data=d;save();refresh();parents();document.querySelector('#importStatus').textContent='きろくを読み込みました。'}catch{status.textContent='読み込めませんでした。かずのにわのバックアップを選んでください。'}}
document.querySelector('#profile').onchange=e=>{data.current=Number(e.target.value);save();home()};document.querySelector('#sound').onclick=()=>{data.sound=!data.sound;save();refresh();if(!data.sound&&'speechSynthesis'in window)speechSynthesis.cancel();else speak('おとを つけました')};document.querySelector('#parent').onclick=parents;home();
</script></html>
