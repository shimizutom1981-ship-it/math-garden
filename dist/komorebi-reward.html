<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf1e7"><title>こもれびタイル</title><style>
*{box-sizing:border-box}body{margin:0;color:#354c40;background:#edf1e7;font-family:system-ui,-apple-system,sans-serif;min-height:100svh;background-image:radial-gradient(ellipse at 5% 10%,#dce6cb 0,transparent 45%),radial-gradient(ellipse at 100% 80%,#d7e2d6 0,transparent 40%)}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}button:focus-visible{outline:3px solid #c28f45;outline-offset:3px}main{max-width:480px;margin:auto;padding:22px 20px 24px}header{display:flex;align-items:center;justify-content:space-between}.brand small{font-size:9px;letter-spacing:3px;color:#7c8f79}.brand h1{font-size:23px;letter-spacing:3px;margin:4px 0;font-weight:650}.round{border:1px solid #cad5c6;background:#ffffff70;border-radius:50%;width:42px;height:42px;color:#526b54;font-size:18px}.info{display:flex;justify-content:space-between;align-items:end;margin:25px 0 12px}.eyebrow{font-size:10px;letter-spacing:2px;color:#82927d}.stage{font-size:25px;font-family:Georgia,serif;margin-top:4px}.stage span{font-size:14px;font-family:system-ui;margin-right:8px}.count{text-align:right;font-size:12px;color:#6f826b}.bar{height:4px;border-radius:4px;background:#d6dfd0;overflow:hidden;margin-top:9px}.bar i{display:block;background:#7a9870;height:100%;transition:width .3s}#message{text-align:center;font-size:12px;height:22px;margin:17px 0 8px;color:#768771}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:20px 13px 24px;background:#dfe7d6a0;border:1px solid #d1dcc8;border-radius:24px;min-height:284px;align-content:center;box-shadow:inset 0 2px 16px #7f966009}.cell{position:relative;aspect-ratio:.85;min-width:0}.tile{position:absolute;inset:0;border:1px solid #fff9;border-radius:11px;background:linear-gradient(145deg,#fffef7,#f5f0dd);box-shadow:0 4px 0 #c8cbb6,0 6px 8px #63704a20;font-size:clamp(23px,7vw,34px);display:flex;align-items:center;justify-content:center;transition:transform .12s;user-select:none}.tile:active{transform:translateY(3px)}.tile[data-depth="2"]{box-shadow:0 4px 0 #c9cbb6,0 8px 0 #e9e9d9,0 10px 0 #bac3ac}.tile[data-depth="3"]{box-shadow:0 4px 0 #c9cbb6,0 8px 0 #e9e9d9,0 10px 0 #bac3ac,0 14px 0 #e3e5d4,0 16px 0 #b1bca3}.tile b{position:absolute;right:3px;bottom:2px;font-size:9px;color:#909d83;font-weight:500}.hint{animation:glow .7s infinite alternate}.tray-label{text-align:center;margin:22px 0 10px;font-size:10px;letter-spacing:2px;color:#85937b}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:10px;background:#cdd8c3;border-radius:15px;box-shadow:inset 0 2px 5px #66805214}.slot{aspect-ratio:.88;border-radius:8px;background:#bdcbae65;display:flex;align-items:center;justify-content:center;font-size:27px}.slot.filled{background:#fffaf0;box-shadow:0 3px 0 #aebd9f;animation:pop .2s}.actions{display:flex;justify-content:center;gap:25px;margin-top:25px}.actions button{background:none;border:0;color:#667c5f;font-size:11px;min-width:65px}.actions span{display:grid;place-items:center;font-size:21px;background:#ffffff65;width:46px;height:46px;border:1px solid #d0dbc8;border-radius:16px;margin:0 auto 7px}.actions button:disabled{opacity:.35}.footer{text-align:center;font-size:10px;color:#8d9a86;margin-top:25px;letter-spacing:1px}.veil{position:fixed;inset:0;background:#273e3155;backdrop-filter:blur(8px);display:grid;place-items:center;padding:24px;z-index:10}.veil[hidden]{display:none}.dialog{background:#faf9f0;border:1px solid white;border-radius:28px;text-align:center;padding:35px 25px;max-width:350px;width:100%;box-shadow:0 20px 80px #243b3122}.dialog .flower{font-size:50px}.dialog h2{font-size:23px;font-weight:600}.dialog p{font-size:13px;line-height:1.9;color:#76836b;white-space:pre-line}.primary{background:#637f59;color:#fff;border:0;padding:14px 25px;border-radius:25px;width:100%;margin-top:12px}.secondary{border:0;background:none;color:#738566;padding:15px}.burst{position:fixed;pointer-events:none;font-size:24px;z-index:20;animation:float 1s forwards}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}@keyframes glow{to{box-shadow:0 0 0 3px #a9bc72,0 0 20px #b4ca7c}}@keyframes float{to{transform:translate(var(--x),-150px) rotate(90deg);opacity:0}}@media(max-height:740px){main{padding-top:13px}.info{margin-top:15px}#message{margin-top:10px}.board{min-height:240px;padding-top:12px;padding-bottom:19px}.actions{margin-top:15px}.footer{margin-top:16px}}
</style><main><header><div class="brand"><small>A LITTLE MOMENT OF CALM</small><h1>こもれびタイル</h1></div><button class="round" id="sound" aria-label="音をオンにする">♪</button></header><div class="info"><div><div class="eyebrow" id="season">はじまりの庭</div><div class="stage"><span>ステージ</span><strong id="level">01</strong></div></div><div class="count">そろえた組<br><strong id="pairs">0 / 6</strong></div></div><div class="bar"><i id="progress"></i></div><p id="message" role="status" aria-live="polite">同じ絵を3枚、タップしてそろえよう</p><div class="board" id="board" aria-label="タイル盤面"></div><div class="tray-label">3枚そろうと消えます · 置き場は7枚</div><div id="tray" class="tray" aria-label="選んだタイル"></div><div class="actions"><button id="undo"><span>↶</span>ひとつ戻す</button><button id="hint"><span>✧</span>ヒント</button><button id="retry"><span>⟳</span>やり直す</button></div><div class="footer">急がなくて大丈夫。あなたのペースで。</div></main><div class="veil" id="modal" hidden><div class="dialog"><div class="flower" id="icon">🌷</div><h2 id="title"></h2><p id="description"></p><button class="primary" id="continue"></button><button class="secondary" id="close">閉じる</button></div></div><script>
const icons=['🍓','🍋','🫐','🌷','🥑','🍊','🌼','🍇','🍒','🍀','🍑','🌻'];const names=['いちご','レモン','ブルーベリー','チューリップ','アボカド','みかん','花','ぶどう','さくらんぼ','クローバー','もも','ひまわり'];const $=id=>document.getElementById(id);let state,history=[],busy=false,sound=false,ctx,hintTimer;const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function generate(level){const kinds=Math.min(12,3+Math.floor((level-1)/2)),groups=Math.min(30,6+(level-1)*2),total=groups*3,cells=Math.min(24,total),stacks=Array.from({length:cells},()=>[]);let heights=Array(cells).fill(0);for(let i=0;i<total;i++)heights[i%cells]++;let order=[];while(heights.some(n=>n)){let available=heights.map((n,i)=>n?i:-1).filter(n=>n>=0);let c=available[Math.floor(Math.random()*available.length)];order.push(c);heights[c]--}let types=shuffle(Array.from({length:groups},(_,i)=>i%kinds));order.forEach((c,i)=>stacks[c].push(types[Math.floor(i/3)]));stacks.forEach(s=>s.reverse());return {level,stacks,tray:[],done:0,groups,order}}
function save(){if(rewardToken)parent.postMessage({type:'komorebi:save',token:rewardToken,state},location.origin)}
function start(level){state=generate(level);history=[];busy=false;$('modal').hidden=true;save();render()}
function render(){ $('level').textContent=String(state.level).padStart(2,'0');$('season').textContent=state.level<4?'はじまりの庭':state.level<9?'花ひらく小道':state.level<17?'木漏れ日の森':'実りの庭';$('pairs').textContent=`${state.done} / ${state.groups}`;$('progress').style.width=100*state.done/state.groups+'%';$('board').innerHTML='';state.stacks.forEach((s,i)=>{let cell=document.createElement('div');cell.className='cell';if(s.length){let t=document.createElement('button');t.className='tile';t.dataset.depth=Math.min(3,s.length);t.dataset.cell=i;t.setAttribute('aria-label',`${names[s.at(-1)]}、残り${s.length}枚`);t.innerHTML=icons[s.at(-1)]+(s.length>1?`<b>${s.length}</b>`:'');t.onclick=()=>pick(i);cell.append(t)}$('board').append(cell)});$('tray').innerHTML='';for(let i=0;i<7;i++){let t=document.createElement('div');t.className='slot'+(state.tray[i]!==undefined?' filled':'');t.textContent=icons[state.tray[i]]||'';$('tray').append(t)}$('undo').disabled=!history.length;}
function tone(match=false){if(!sound)return;try{ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();(match?[523,659,784]:[440]).forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);let t=ctx.currentTime+i*.08;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.26)})}catch{}}
function celebrate(){let r=$('tray').getBoundingClientRect();for(let i=0;i<9;i++){let el=document.createElement('div');el.className='burst';el.textContent=['✦','✧','🌼'][i%3];el.style.left=r.left+r.width/2+'px';el.style.top=r.top+'px';el.style.setProperty('--x',(Math.random()-.5)*260+'px');document.body.append(el);setTimeout(()=>el.remove(),1100)}}
function pick(i){if(busy||!state.stacks[i].length||state.tray.length>=7)return;history.push(JSON.stringify(state));if(history.length>100)history.shift();let type=state.stacks[i].pop();state.tray.push(type);state.tray.sort((a,b)=>a-b);tone();let matched=state.tray.filter(t=>t===type).length===3;render();if(matched){busy=true;setTimeout(()=>{state.tray=state.tray.filter(t=>t!==type);state.done++;tone(true);celebrate();busy=false;save();render();$('message').textContent=['いい感じ、その調子。','ぽんっ。3枚そろいました。','ひと息つきながら、どうぞ。'][state.done%3];check()},240)}else{save();check()}}
function check(){if(state.done===state.groups){show('🌷','庭が、ひとつ華やかに。',`ステージ ${state.level} クリア！\nつぎは さんすう・こくご・えいごを やろう！`,'がくしゅうに もどる →',()=>{parent.postMessage({type:'komorebi:complete',token:rewardToken},location.origin);$('continue').disabled=true},false)}else if(state.tray.length>=7){show('🍃','ちょっと、ひと休み。','置き場がいっぱいになりました。\nお助けで1種類をそろえて、続けられます。','お助けで続ける',rescue,true)}}
function show(icon,title,desc,button,fn,close){$('icon').textContent=icon;$('title').textContent=title;$('description').textContent=desc;$('continue').textContent=button;$('continue').onclick=fn;$('close').hidden=!close;$('modal').hidden=false}
function rescue(){let freq={};state.tray.forEach(t=>freq[t]=(freq[t]||0)+1);let type=Number(Object.keys(freq).sort((a,b)=>freq[b]-freq[a])[0]);let need=3-freq[type];history.push(JSON.stringify(state));for(let s of state.stacks){for(let i=s.length-1;i>=0&&need;i--)if(s[i]===type){s.splice(i,1);need--}}state.tray=state.tray.filter(t=>t!==type);state.done++;$('modal').hidden=true;save();render();celebrate();check()}
$('undo').onclick=()=>{if(busy||!history.length)return;state=JSON.parse(history.pop());$('modal').hidden=true;save();render();$('message').textContent='ひとつ前に戻しました。'};$('hint').onclick=()=>{if(busy)return;let counts={};state.tray.forEach(t=>counts[t]=(counts[t]||0)+1);state.stacks.forEach(s=>{if(s.length)counts[s.at(-1)]=(counts[s.at(-1)]||0)+1});let type=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).find(t=>state.stacks.some(s=>s.at(-1)===Number(t)));if(type===undefined)return;document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));document.querySelectorAll('.tile').forEach(e=>{if(state.stacks[Number(e.dataset.cell)].at(-1)===Number(type))e.classList.add('hint')});$('message').textContent=counts[type]>=3?`${names[type]}をそろえてみよう。`:'まずは光っている絵柄を見てみよう。';clearTimeout(hintTimer);hintTimer=setTimeout(()=>document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint')),2500)};$('retry').onclick=()=>{if(busy)return;show('🌱','もう一度、この庭から。','今のステージを新しい配置で始めます。','やり直す',()=>start(state.level),true)};$('close').onclick=()=>{$('modal').hidden=true};$('sound').onclick=()=>{sound=!sound;$('sound').style.background=sound?'#cbdab9':'#ffffff70';$('sound').setAttribute('aria-label',sound?'音をオフにする':'音をオンにする');tone()};let rewardToken=null;document.querySelector('main').hidden=true;addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='komorebi:init'||rewardToken)return;rewardToken=e.data.token;document.querySelector('main').hidden=false;if(e.data.state){state=e.data.state;render();check()}else start(e.data.level)});parent.postMessage({type:'komorebi:ready'},location.origin);
</script></html>
